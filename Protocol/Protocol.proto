syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN {
	string jwt = 1;
}

message S_LOGIN {
	bool success = 1;
	uint32 user_id = 2;
}

message C_ENTER_ROOM {
	uint32 room_id = 1;
}

message S_ENTER_ROOM {
	bool success = 1;
}

message C_CHAT {
  int32 user_id = 1;
  string msg = 2;
}

message S_CHAT {
  int32 user_id = 1;
  string msg = 2;
}